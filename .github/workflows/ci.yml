name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact commit to verify
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Test release automation
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s .github/scripts/tests
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Test X11 stacking and window manager frames
        if: runner.os == 'Linux'
        run: xvfb-run -a env X11_HIT_TEST_REQUIRED=1 cargo test --manifest-path src-tauri/Cargo.toml --locked overlapping_client_and_window_manager_frame -- --nocapture
      - run: npm run tauri build -- --no-bundle
