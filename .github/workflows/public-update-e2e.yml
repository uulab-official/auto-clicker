name: Public release update verification
on:
  workflow_dispatch:
    inputs:
      baseline_version:
        description: Published baseline release version (MAJOR.MINOR.PATCH)
        required: true
        default: '0.1.0'
      target_version:
        description: Expected latest public release version (MAJOR.MINOR.PATCH)
        required: true
        default: '0.1.1'
      probe_only:
        description: Test accessibility of the original application without starting an update
        type: boolean
        default: false
permissions:
  contents: read
env:
  EXPECTED_BASELINE_VERSION: ${{ inputs.baseline_version }}
  EXPECTED_UPDATE_VERSION: ${{ inputs.target_version }}
  PUBLIC_UPDATE_PROBE_ONLY: ${{ inputs.probe_only && '1' || '0' }}
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Check baseline version and asset resolution
        run: python3 .github/scripts/public-update-e2e/test_release_info.py
      - name: Install isolated desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libxdo3 libayatana-appindicator3-1 libfuse2 xvfb xdotool dbus-x11 at-spi2-core python3-pyatspi libatk-adaptor
      - name: Update actual published AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: xvfb-run -a -s '-screen 0 1280x1024x24' dbus-run-session -- bash .github/scripts/public-update-e2e/linux.sh
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Check baseline version and asset resolution
        run: python3 .github/scripts/public-update-e2e/test_release_info.py
      - name: Update actual published macOS app
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/public-update-e2e/macos.sh
