name: Automatic release from main

on:
  push:
    branches: [main]

# Serialise version reservation, release assets and publication across pushes.
# Newer main pushes are queued; older runs never publish after main advances.
concurrency:
  group: auto-release-main
  queue: max

permissions:
  contents: write

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      release_sha: ${{ steps.version.outputs.release_sha }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Create or resume an exact version commit
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: bash .github/scripts/auto-release/prepare.sh

  test:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ needs.prepare.outputs.release_sha }}

  reserve:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.reserve.outputs.should_build }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
      - name: Reserve an exact tag and a new owned draft
        id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: bash .github/scripts/auto-release/reserve.sh

  build_and_validate:
    needs: [prepare, reserve]
    if: needs.reserve.outputs.should_build == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      release_sha: ${{ needs.prepare.outputs.release_sha }}
      release_tag: ${{ needs.prepare.outputs.release_tag }}
    secrets: inherit

  publish:
    needs: [prepare, reserve, build_and_validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
      - name: Publish only the validated current main release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: bash .github/scripts/auto-release/publish.sh
