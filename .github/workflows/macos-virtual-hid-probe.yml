name: Probe macOS isolated virtual HID availability

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Probe virtual keyboard creation without sending input
        run: |
          clang -framework IOKit -framework CoreFoundation .github/scripts/macos-click-e2e/hid-availability.c -o "$RUNNER_TEMP/hid-probe"
          echo 'Unprivileged runner:'
          "$RUNNER_TEMP/hid-probe"
          echo 'Privileged runner:'
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted "$RUNNER_TEMP/hid-probe"
