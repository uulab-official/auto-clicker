name: macOS in-process Carbon hotkey callback
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri build -- --no-bundle
      - name: Verify the in-process Carbon callback on a disposable VM
        run: bash .github/scripts/macos-click-e2e/queue-test.sh
