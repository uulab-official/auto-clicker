name: macOS in-process Carbon hotkey callback
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shortcut: ['Control+Shift+F8', 'Control+Shift+Escape']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Probe isolated virtual HID availability without sending input
        run: |
          clang -framework IOKit -framework CoreFoundation .github/scripts/macos-click-e2e/hid-availability.c -o "$RUNNER_TEMP/hid-probe"
          "$RUNNER_TEMP/hid-probe"
      - run: npm ci
      - run: npm run tauri build -- --no-bundle
      - name: Verify the in-process Carbon callback on a disposable VM
        env:
          AUTOCLICKER_TEST_SHORTCUT: ${{ matrix.shortcut }}
        run: bash .github/scripts/macos-click-e2e/queue-test.sh
