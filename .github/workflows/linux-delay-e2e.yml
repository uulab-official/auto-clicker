name: Linux isolated start delay verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual_gnome_tauri:
    needs: actual_gnome_portal_probe
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GNOME and application build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gnome-shell gnome-control-center xdg-desktop-portal xdg-desktop-portal-gnome dbus-x11 libglib2.0-bin python3-pyatspi python3-gi gir1.2-gtk-3.0 at-spi2-core libatk-adaptor pipewire libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run tauri build -- --no-bundle
      - run: cargo build --manifest-path experiments/wayland-portal/Cargo.toml --bin wayland-portal-prototype --locked
      - name: Verify real GNOME target click and emergency stop in isolated desktop
        run: dbus-run-session -- bash experiments/wayland-portal/gnome_app_test.sh
      - name: Verify real GNOME remote-control revocation in isolated desktop
        run: GNOME_TEST_REVOKE=1 dbus-run-session -- bash experiments/wayland-portal/gnome_app_test.sh
  actual_gnome_portal_probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install isolated GNOME Shell and portal
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gnome-shell gnome-control-center xdg-desktop-portal xdg-desktop-portal-gnome dbus-x11 libglib2.0-bin python3-pyatspi python3-gi gir1.2-gtk-3.0 at-spi2-core libatk-adaptor pipewire
      - run: cargo build --manifest-path experiments/wayland-portal/Cargo.toml --bin wayland-portal-prototype --locked
      - name: Probe real GNOME portals without pointer input
        run: dbus-run-session -- bash experiments/wayland-portal/gnome_probe.sh
  actual_kde_portal_probe:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install virtual KWin and real KDE portal
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends kwin-wayland xdg-desktop-portal xdg-desktop-portal-kde qtwayland5 dbus-x11 libglib2.0-bin python3-pyatspi at-spi2-core libatk-adaptor pipewire
      - run: cargo build --manifest-path experiments/wayland-portal/Cargo.toml --bin wayland-portal-prototype --locked
      - name: Probe real KDE portal availability and consent UI without input
        run: dbus-run-session -- bash experiments/wayland-portal/kde_probe.sh
  verify:
    if: ${{ false }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Install isolated desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev sway dbus-x11 at-spi2-core python3-pyatspi python3-gi gir1.2-gtk-3.0 libatk-adaptor libxkbcommon-dev
      - run: npm ci
      - run: npm run tauri build -- --no-bundle
      - run: cargo build --manifest-path experiments/wayland-portal/Cargo.toml --locked
      - name: Verify Tauri window hide, mock emergency stop and portal loss on Sway
        run: |
          for mode in loop_stop remote_closed shortcut_closed service_loss; do
            dbus-run-session -- bash experiments/wayland-portal/tauri_sway_test.sh "$mode"
          done
