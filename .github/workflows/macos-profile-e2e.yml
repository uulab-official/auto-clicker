name: macOS native settings backup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri build -- --no-bundle
      - name: Exercise native save and open panels on a disposable macOS VM
        run: bash .github/scripts/macos-profile-e2e/run.sh
