name: Verify draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to verify
        required: true
        type: string
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected vMAJOR.MINOR.PATCH' >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Install signature verifier
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Verify updater metadata and signatures (release remains a draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --pattern latest.json --dir "$RUNNER_TEMP"
          GITHUB_REF_NAME="$RELEASE_TAG" python3 .github/scripts/verify-release.py "$RUNNER_TEMP/latest.json"
