name: Windows installation and updater test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-e2e:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Prepare isolated test signing key and endpoint
        run: python .github/scripts/windows-update-test/prepare.py
      - name: Build and sign test update
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'auto-clicker-update-test'
          Get-Content "$tmp/key.env" | ForEach-Object { $n, $v = $_ -split '=', 2; [Environment]::SetEnvironmentVariable($n, $v, 'Process') }
          npm run tauri build -- --bundles msi --config "$tmp/candidate.json"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate build failed' }
          Copy-Item src-tauri/target/release/auto-clicker.exe "$tmp/candidate.exe"
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          Copy-Item $msi.FullName "$tmp/update.msi"
          Copy-Item "$($msi.FullName).sig" "$tmp/update.msi.sig"
      - name: Instrument test-only baseline and build
        run: python .github/scripts/windows-update-test/instrument.py
      - name: Build test-only baseline executable
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'auto-clicker-update-test'
          npm run tauri build -- --no-bundle --config "$tmp/baseline.json"
          if ($LASTEXITCODE -ne 0) { throw 'Baseline build failed' }
      - name: Install published release and exercise signed updater
        shell: pwsh
        run: .github/scripts/windows-update-test/run.ps1
