name: macOS inactive window safety verification
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Ignored for source-build verification
        required: false
        default: v0.1.12
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri build -- --no-bundle
      - name: Check inactive application pause, resume and stop
        env:
          APP_BINARY: ${{ github.workspace }}/src-tauri/target/release/auto-clicker
        run: bash .github/scripts/macos-click-e2e/pause-test.sh
