name: Windows public release functionality
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Public release tag to test
        required: true
        default: v0.1.11
permissions:
  contents: read
jobs:
  backup:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install the verified public MSI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: .github/scripts/windows-public-014/install.ps1
      - name: Exercise actual backup and restore dialogs
        shell: pwsh
        run: .github/scripts/windows-profile-e2e/run.ps1
  clicks:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install the verified public MSI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: .github/scripts/windows-public-014/install.ps1
      - name: Exercise clicks and emergency stop
        shell: pwsh
        run: .github/scripts/windows-click-e2e/run.ps1
