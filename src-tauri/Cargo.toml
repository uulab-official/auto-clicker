[package]
name = "auto-clicker"
version = "0.1.1"
edition = "2021"

[lib]
name = "auto_clicker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
enigo = "0.6"
tauri-plugin-updater = "2.14.1"
serde_json = "1.0.154"
