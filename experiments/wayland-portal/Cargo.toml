[package]
name = "wayland-portal-prototype"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ashpd = "0.11"
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.6", default-features = false, features = ["wayland"] }

[workspace]
